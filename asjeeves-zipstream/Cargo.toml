[package]
name = "asjeeves-zipstream"
description = "Compresses files into a zip over a stream"
edition = "2024"
homepage = "https://github.com/Ameelio/asjeeves/"
license = "MIT"
readme = "README.md"
repository = "https://github.com/Ameelio/asjeeves/"
version = "0.1.1"

[dependencies]
crc32fast.workspace = true
flate2.workspace = true
tokio.workspace = true

[dev-dependencies]
tokio = { workspace = true, features = ["fs", "macros", "rt", "rt-multi-thread"]}
tokio-test = "0.4.5"
