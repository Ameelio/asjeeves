[package]
name = "asjeeves"
version = "0.1.2-alpha.1"
edition = "2024"

[features]
axum = [
  "dep:asjeeves-csrf",
  "dep:asjeeves-user-session",
  "tower"
]

dup_req_protection = [
  "dep:asjeeves-dup-req-protection"
]

encryption = [
  "dep:asjeeves-encryption",
]

logger = [
  "telemetry",
  "asjeeves-telemetry/logger"
]

reqwest = [
  "telemetry",
  "asjeeves-telemetry/reqwest"
]

telemetry = [
  "dep:asjeeves-telemetry",
]

tower = [
  "dep:asjeeves-health-check",
  "dep:asjeeves-jwks-service",
  "asjeeves-telemetry/tower",
  "telemetry"
]

[dependencies]
asjeeves-csrf = { path = "../asjeeves-csrf", optional = true }
asjeeves-dup-req-protection = { path = "../asjeeves-dup-req-protection", optional = true }
asjeeves-encryption = { workspace = true, optional = true }
asjeeves-health-check = { path = "../asjeeves-health-check", optional = true }
asjeeves-jwks-service = { path = "../asjeeves-jwks-service", optional = true }
asjeeves-telemetry = { path = "../asjeeves-telemetry", optional = true }
asjeeves-user-session = { path = "../asjeeves-user-session", optional = true }
