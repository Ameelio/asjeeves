[package]
name = "asjeeves-csrf"
description = "CSRF protection."
edition = "2024"
homepage = "https://github.com/Ameelio/asjeeves/"
license = "MIT"
readme = "README.md"
repository = "https://github.com/Ameelio/asjeeves/"
version = "0.1.3"

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(coverage_nightly)"] }

[dependencies]

# #########################################
# Middleware - axum
# This crate is for middleware used by Axum
# #########################################
axum.workspace = true
bytes.workspace = true
cookie = { workspace = true, features = ["percent-encode"]}

# #########################################
# Format conversion
# base64ct - constant time encoding and decoding to base64.
# #########################################
base64ct.workspace = true

# #########################################
# Secure Randomization
# #########################################
rand_chacha.workspace = true
rand_core.workspace = true
asjeeves-encryption.workspace = true

# #########################################
# Avoid CVE-2026-25727
# #########################################
time = "^0.3.47"

# #########################################
# Instrumentation and Logging
# #########################################
tracing.workspace = true

[dev-dependencies]
axum-test = { version = "21.1" }
tokio = { version = "1.48.0", features = ["test-util"] }

