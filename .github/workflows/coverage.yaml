name: Test Coverage

on:
  push:
    branches:
      - "main"
      - "release/**"
  pull_request:
    branches: 
      - "main"
      - "release/**"

jobs:
  test:
    name: Run Unit Tests
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6379:6379
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install Rust Toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install llvm-cov
        uses: taiki-e/install-action@cargo-llvm-cov

      - name: Run Coverage
        run: cargo llvm-cov --all-features --workspace --lcov --output-path lcov.info --ignore-filename-regex "asjeeves-telemetry/src/database_metrics.rs|asjeeves-telemetry/src/axum_metrics.rs"
        env:
          TEST_REDIS_URL: redis://localhost:6379

      - name: Build Coverage Report.
        uses: romeovs/lcov-reporter-action@v0.3.1
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          lcov-file: lcov.info
