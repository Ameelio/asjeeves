name: Lint

on:
  push:
    branches:
      - "main"
      - "release/**"
  pull_request:
    branches: 
      - "main"
      - "release/**"

jobs:
  clippy:
    name: Run Clippy
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Lint
        run: cargo clippy -- -D warnings
